name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      update_urgency:
        description: Mark this APK update as important
        type: choice
        options: [ normal, critical ]
        default: normal
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          run_install: false

      - name: Install Dependencies
        run: pnpm install --allow-build=sharp

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_STORE_PASSWORD" ]]; then
            echo "Missing Android signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and ANDROID_STORE_PASSWORD to repository Actions secrets. See README.md, Android updates."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/android-signing/release.jks"

      - name: Create Config & Assets
        run: |
          mkdir -p public
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > public/index.html
          cat << 'EOF' > capacitor.config.ts
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.ifaz.routinemax',
            appName: 'Routine Scrapper Max',
            webDir: 'public',
            server: {
              url: 'https://routine-scrapper-max.vercel.app',
              cleartext: true
            }
          };
          export default config;
          EOF
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path

          activities = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          if len(activities) != 1:
              raise SystemExit(f'Expected one generated MainActivity.java, found {len(activities)}')

          activity = activities[0]
          content = activity.read_text()
          if 'setVerticalScrollBarEnabled(false)' not in content:
              closing_brace = content.rfind('}')
              if closing_brace < 0:
                  raise SystemExit('Could not find the MainActivity class body')
              native_scrollbar_settings = '''
              @Override
              protected void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  com.getcapacitor.Bridge bridge = getBridge();
                  android.webkit.WebView webView = bridge == null ? null : bridge.getWebView();
                  if (webView != null) {
                      webView.setVerticalScrollBarEnabled(false);
                      webView.setHorizontalScrollBarEnabled(false);
                  }
              }
          '''
              content = content[:closing_brace] + native_scrollbar_settings + content[closing_brace:]
              activity.write_text(content)
          PY
          npx cap sync
          npx @capacitor/assets generate --android --assetPath assets --androidProject android --iconBackgroundColor '#e9f2fb'
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          content = gradle.read_text()
          content, code_count = re.subn(r'(?m)^(\s*)versionCode\s+\d+', r'\1versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()', content, count=1)
          content, name_count = re.subn(r'(?m)^(\s*)versionName\s+"[^"]+"', r'\1versionName = System.getenv("ANDROID_VERSION_NAME") ?: "1.0"', content, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Could not set Android versionCode/versionName in build.gradle')

          signing = '''    signingConfigs {
              release {
                  storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "release.jks")
                  storePassword System.getenv("ANDROID_STORE_PASSWORD") ?: ""
                  keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: ""
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: ""
              }
          }

          '''
          if 'signingConfigs {' not in content:
              content = content.replace('    buildTypes {', signing + '    buildTypes {', 1)
          build_types_start = content.find('buildTypes {')
          release_block = re.search(r'(?m)^(\s*)release\s*\{', content[build_types_start:]) if build_types_start >= 0 else None
          if not release_block:
              raise SystemExit('Could not find release build type in build.gradle')
          start = build_types_start + release_block.end()
          content = content[:start] + '\n' + release_block.group(1) + '    signingConfig signingConfigs.release' + content[start:]
          gradle.write_text(content)
          PY
          # Android 12+ inserts a system splash before the app's own animated splash.
          # Keep the required native launch window black and icon-free so the custom
          # animated splash is the first branded screen users see.
          python3 - <<'PY'
          from pathlib import Path

          styles = Path('android/app/src/main/res/values/styles.xml')
          content = styles.read_text()
          start = content.find('<style name="AppTheme.NoActionBarLaunch"')
          end = content.find('</style>', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not find Capacitor launch theme in styles.xml')

          launch_theme = content[start:end]
          launch_theme = launch_theme.replace(
              '<item name="android:background">@drawable/splash</item>',
              '<item name="android:background">@android:color/black</item>',
          )
          launch_theme += '''
              <item name="android:windowSplashScreenAnimatedIcon">@android:color/transparent</item>
              <item name="windowSplashScreenAnimatedIcon">@android:color/transparent</item>
              <item name="android:windowSplashScreenBackground">@android:color/black</item>
              <item name="windowSplashScreenBackground">@android:color/black</item>'''
          content = content[:start] + launch_theme + content[end:]
          styles.write_text(content)
          PY

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 4.0.${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Routine-Scrapper-Max.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Routine-Scrapper-Max
          path: Routine-Scrapper-Max.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Routine Scrapper Max APK — build ${{ github.run_number }}
          body: |
            Automatically built Android update, build ${{ github.run_number }}.

            APK signing: stable
            Update urgency: ${{ inputs.update_urgency || 'normal' }}

            The app checks this release and can notify Android users when an update is available. Tapping the notice downloads the APK; Android asks the user to confirm installation.
          files: Routine-Scrapper-Max.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

