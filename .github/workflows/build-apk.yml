name: Build Android APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          run_install: false

      - name: Install Dependencies
        run: pnpm install

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Create Config & Assets
        run: |
          pnpm add @capacitor/core @capacitor/android
          pnpm add -D @capacitor/cli
          pnpm --allow-build=sharp add -D @capacitor/assets
          mkdir -p public
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > public/index.html
          cat << 'EOF' > capacitor.config.ts
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.ifaz.routinemax',
            appName: 'Routine Scrapper Max',
            webDir: 'public',
            server: {
              url: 'https://routine-scrapper-max.vercel.app',
              cleartext: true
            }
          };
          export default config;
          EOF
          npx cap add android
          npx cap sync
          npx @capacitor/assets generate --android --assetPath assets --androidProject android --iconBackgroundColor '#e9f2fb'
          # Android 12+ inserts a system splash before the app's own animated splash.
          # Keep the required native launch window black and icon-free so the custom
          # animated splash is the first branded screen users see.
          python3 - <<'PY'
          from pathlib import Path

          styles = Path('android/app/src/main/res/values/styles.xml')
          content = styles.read_text()
          start = content.find('<style name="AppTheme.NoActionBarLaunch"')
          end = content.find('</style>', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not find Capacitor launch theme in styles.xml')

          launch_theme = content[start:end]
          launch_theme = launch_theme.replace(
              '<item name="android:background">@drawable/splash</item>',
              '<item name="android:background">@android:color/black</item>',
          )
          launch_theme += '''
              <item name="android:windowSplashScreenAnimatedIcon">@android:color/transparent</item>
              <item name="windowSplashScreenAnimatedIcon">@android:color/transparent</item>
              <item name="android:windowSplashScreenBackground">@android:color/black</item>
              <item name="windowSplashScreenBackground">@android:color/black</item>'''
          content = content[:start] + launch_theme + content[end:]
          styles.write_text(content)
          PY

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Routine-Scrapper-Max.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Routine-Scrapper-Max
          path: Routine-Scrapper-Max.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Routine Scrapper Max APK — build ${{ github.run_number }}
          body: |
            Automatically built APK for this version.

            Download `Routine-Scrapper-Max.apk` and install it on Android.
          files: Routine-Scrapper-Max.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
