name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          run_install: false

      - name: Install Dependencies
        run: pnpm install

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Create Config & Assets
        run: |
          pnpm add @capacitor/core @capacitor/android
          pnpm add -D @capacitor/cli
          mkdir -p public
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > public/index.html
          cat << 'EOF' > capacitor.config.ts
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.ifaz.routinemax',
            appName: 'Routine Scrapper Max',
            webDir: 'public',
            server: {
              url: 'https://routine-scrapper-max.vercel.app',
              cleartext: true
            }
          };
          export default config;
          EOF
          npx cap add android
          npx cap sync

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Routine-Scrapper-Max.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Routine-Scrapper-Max
          path: Routine-Scrapper-Max.apk
